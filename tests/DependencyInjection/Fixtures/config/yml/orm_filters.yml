doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                dbname: db
                server_version: 9.4.0

    orm:
        filters:
            soft_delete:
                class: Doctrine\Bundle\Doctrine_Bundle\Tests\Dependency_Injection\Test_Filter
                enabled: true
            myFilter:
                class: Doctrine\Bundle\Doctrine_Bundle\Tests\Dependency_Injection\Test_Filter
                enabled: true
                parameters:
                    myParameter: myValue
                    mySecondParameter: mySecondValue
