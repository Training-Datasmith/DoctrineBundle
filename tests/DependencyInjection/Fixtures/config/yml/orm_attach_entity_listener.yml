doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                dbname: db

    orm:
        entity_managers:
            default:
                entity_listeners:
                        External_Bundles\Entities\Foo_Entity:
                            My_Bundles\Listeners\Foo_Entity_Listener:
                                prePersist:
                                postPersist: [postPersist]
                                postLoad: [postLoadHandler]
                        External_Bundles\Entities\Bar_Entity:
                                My_Bundles\Listeners\Bar_Entity_Listener:
                                    prePersist: [prePersist, prePersistHandler]
                                My_Bundles\Listeners\Log_Delete_Entity_Listener:
                                    postDelete: [postDelete]
