services:
    custom_entity_listener_resolver:
        class: Doctrine\Bundle\Doctrine_Bundle\Tests\Dependency_Injection\Fixtures\Custom_Entity_Listener_Service_Resolver
        public: false

    entity_listener:
        class: EntityListener
        public: false
        tags:
            - { name: doctrine.orm.entity_listener }

doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                dbname: db

    orm:
        default_entity_manager: em1
        entity_managers:
            em1:
                entity_listener_resolver: custom_entity_listener_resolver
