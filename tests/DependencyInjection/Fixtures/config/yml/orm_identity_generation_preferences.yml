doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                dbname: db

    orm:
        default_entity_manager: em1
        entity_managers:
            em1:
                mappings:
                    XmlBundle: ~
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\Postgre_SQL_Platform: identity
            em2:
                mappings:
                    XmlBundle: ~
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\Postgre_SQL_Platform: sequence
