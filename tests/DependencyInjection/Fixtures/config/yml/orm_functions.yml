doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                dbname: db

    orm:
        entity_managers:
            default:
                mappings:
                    XmlBundle: ~
                dql:
                    string_functions:
                        test_string: Doctrine\Bundle\Doctrine_Bundle\Tests\Dependency_Injection\Test_String_Function
                    numeric_functions:
                        test_numeric: Doctrine\Bundle\Doctrine_Bundle\Tests\Dependency_Injection\Test_Numeric_Function
                    datetime_functions:
                        test_datetime: Doctrine\Bundle\Doctrine_Bundle\Tests\Dependency_Injection\Test_Datetime_Function
